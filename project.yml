name: Caffeinate
options:
  bundleIdPrefix: io.github.leok7v
  deploymentTarget:
    macOS: "13.0"
targets:
  Caffeinate:
    type: application
    platform: macOS
    sources:
      - path: Caffeinate
        excludes:
          - Caffeinate.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.leok7v.Caffeinate
        PRODUCT_NAME: Caffeinate
        MARKETING_VERSION: "26.11.18"
        CURRENT_PROJECT_VERSION: "261118.0000"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: Caffeinate/Caffeinate.entitlements
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: YES
        DEAD_CODE_STRIPPING: YES
        DEVELOPMENT_ASSET_PATHS: "\"Caffeinate/Preview Content\""
        ENABLE_PREVIEWS: YES
        SWIFT_VERSION: "5.0"
        SWIFT_EMIT_LOC_STRINGS: YES
        ENABLE_USER_SCRIPT_SANDBOXING: YES
